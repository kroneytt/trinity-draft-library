name: Deploy Card Library to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy card images into site
        run: |
          mkdir -p site/images
          cp -r images/en site/images/en
          cp images/card_back.jpg site/images/
          pip install pillow
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image
          out = Path("site/images/thumb"); out.mkdir(parents=True, exist_ok=True)
          for p in Path("images/en").glob("*.jpg"):
              im = Image.open(p); im.thumbnail((360, 520)); im.save(out / p.name, quality=82)
          EOF

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
